<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吃什么</title>
  <meta name="description" content="随机选择今天吃什么">
  <link rel="stylesheet" href="css/whattoeat.css">
</head>
<body>
  <div class="whattoeat-container">
    <div class="whattoeat-header">
      <h1>吃什么</h1>
      <p class="description">随机选择今天吃什么</p>
    </div>

    <div class="food-randomizer">
      <button id="randomFoodBtn" class="random-btn" type="button">随机选择</button>
      <div id="foodResult" class="food-result">
        <p>点击按钮获取推荐！</p>
      </div>
    </div>

    <div class="food-list-section">
      <h2>已添加食品列表</h2>
      <div class="empty-state" id="emptyState">
        <p>还没有添加任何食品，快来添加一些吧！</p>
      </div>
      <div class="food-list" id="foodList">
        <div class="food-grid" id="foodGrid">
          <!-- 已添加的食品将由 JS 动态生成 -->
        </div>
      </div>
    </div>
  </div>

  <script src="js/whattoeat.js"></script>
</body>
</html>
